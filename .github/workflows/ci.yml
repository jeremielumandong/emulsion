name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Full debug symbols and incremental state exhaust hosted-runner storage
  # when linking the workspace tests and examples. Keep local profiles intact.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  site-build:
    name: Website container
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/site.yml

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changes outside the website
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: python
        run: |
          import os
          import subprocess

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          # A new branch has no previous commit: run all Rust checks.
          rust = True
          if base and set(base) != {"0"}:
              if os.environ["EVENT_NAME"] == "pull_request":
                  base = subprocess.check_output(
                      ["git", "merge-base", base, head], text=True
                  ).strip()
              paths = subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", "-z", base, head]
              ).split(b"\0")
              rust = any(path and not path.startswith(b"site/") for path in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"rust={str(rust).lower()}\n")

  check:
    needs: changes
    # Run conservatively if detection fails; skip only confirmed site-only changes.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify vendored GPUI provenance and licenses
        run: python3 scripts/check-gpui-vendor.py
      - name: GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libfontconfig1-dev libfreetype-dev libxcb1-dev libx11-xcb-dev \
            xvfb xauth mesa-vulkan-drivers fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.98'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Do not restore pre-fix artifacts through a fallback cache key.
          prefix-key: v2-ci-no-debuginfo
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: python3 scripts/test-license-staging.py
      - run: python3 scripts/test-release-installer.py
      - run: bash scripts/test-renderer-policy.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # UI fixtures update process environment; run test cases serially.
      - run: cargo test --workspace --locked -- --test-threads=1
      - name: Build production compute backend smoke
        run: cargo build --locked -p emulsion-gpu --example backend_smoke
      - name: Validate compute shaders and production hooks with Mesa lavapipe
        shell: bash
        run: |
          for candidate in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            if [[ -f "$candidate" ]]; then
              export VK_DRIVER_FILES="$candidate"
              export VK_ICD_FILENAMES="$candidate"
              break
            fi
          done
          test -n "${VK_DRIVER_FILES:-}"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/emulsion-compute-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export EMULSION_GPU=software
          export EMULSION_REQUIRE_GPU_TESTS=1
          timeout 180s cargo test --locked -p emulsion-gpu --lib
          timeout 60s target/debug/examples/backend_smoke
          timeout 60s env EMULSION_GPU=cpu target/debug/examples/backend_smoke
      - name: Build real-window renderer smoke
        run: cargo build --locked -p emulsion-app --example renderer_smoke
      - name: Draw and present with Mesa software Vulkan
        shell: bash
        run: |
          for candidate in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            if [[ -f "$candidate" ]]; then
              export VK_DRIVER_FILES="$candidate"
              export VK_ICD_FILENAMES="$candidate"
              break
            fi
          done
          test -n "${VK_DRIVER_FILES:-}"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/emulsion-renderer-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          timeout 45s xvfb-run -a -s '-screen 0 800x600x24' \
            env -u WAYLAND_DISPLAY GPUI_FORCE_SOFTWARE_RENDERING=1 \
            target/debug/examples/renderer_smoke --require-software
      - name: Report build storage
        if: always()
        run: |
          df -h .
          du -sh target 2>/dev/null || true

  platform-check:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-ci-no-debuginfo
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked
      # Windows WARP smoke requires an interactive desktop session. The same
      # renderer_smoke example is compiled here; run it with forced software on
      # a Windows desktop rather than depending on a hosted runner's display.
