name: Linux release package

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require passing CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=1" > /tmp/ci-runs.json
          python3 - <<'PY'
          import json
          runs = json.load(open('/tmp/ci-runs.json'))['workflow_runs']
          if not runs or runs[0]['conclusion'] != 'success':
              raise SystemExit('Release blocked: the latest main-branch CI run for this commit must pass first.')
          PY
      - name: Read release version
        id: version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['workspace']['package']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag=v{version}\n')
          PY
      - name: GPUI and packaging libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libfontconfig1-dev libfreetype-dev libxcb1-dev libx11-xcb-dev \
            desktop-file-utils squashfs-tools
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.98'
      - name: Build release assets
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
        run: bash scripts/package-release.sh
      - name: Check packaged executable
        run: APPIMAGE_EXTRACT_AND_RUN=1 target/appimage/Emulsion-*-x86_64.AppImage --version
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --draft --target "$GITHUB_SHA" --title "Emulsion $RELEASE_TAG" --generate-notes \
            target/release-assets/Emulsion-linux-x86_64.tar.gz \
            target/release-assets/Emulsion-linux-x86_64.tar.gz.sha256 \
            target/appimage/Emulsion-*-x86_64.AppImage
