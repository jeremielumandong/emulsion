[package]
name = "emulsion-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Import and export"

[lints]
workspace = true

[dependencies]
emulsion-ai = { workspace = true }
# Hunspell-compatible caption spell checking with the bundled dictionary.
spellbook = "0.4"
unicode-segmentation = "1"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
getrandom = "0.3"
rayon = { workspace = true }
regex = "1"
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
image = { workspace = true }
png = "0.18"
tiff = "0.11"
zip = { workspace = true }
flate2 = { workspace = true }
quick-xml = { workspace = true }
glam = { workspace = true }
rawler = { workspace = true }
ag-psd = { workspace = true }
jxl-oxide = { workspace = true }
xcf-rs = { workspace = true }
resvg = { workspace = true }
svg2pdf = { version = "0.13", default-features = false, features = ["image"] }
pdf-writer = "0.12"
base64 = { workspace = true }
moxcms = { workspace = true }
kamadak-exif = { workspace = true }
ureq = { workspace = true }
plist = { workspace = true }
tracing = { workspace = true }
emulsion-core = { workspace = true }
emulsion-cloud = { workspace = true }
tempfile = "3.27"
emulsion-raster = { workspace = true }
emulsion-brushes = { workspace = true }
emulsion-filters = { workspace = true }
emulsion-color = { workspace = true }
merman = { version = "=0.7.0", default-features = false, features = ["render"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "print"] }
pollster = { workspace = true }

[dev-dependencies]
emulsion-raster = { workspace = true }
xcf-rs = { workspace = true }
