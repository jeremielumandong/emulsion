[package]
name = "emulsion-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Emulsion image editor"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
gpui-kit = { workspace = true }
emulsion-ui = { workspace = true }
emulsion-core = { workspace = true }
emulsion-gpu = { workspace = true }
emulsion-mcp = { workspace = true }
emulsion-assistant = { workspace = true }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = { workspace = true }

[[bin]]
name = "emulsion"
path = "src/main.rs"

[[test]]
name = "memory_release"
harness = false

[package.metadata.packager]
product-name = "Emulsion"
identifier = "app.emulsion.Emulsion"
category = "GraphicsAndDesign"
description = "The Emulsion image editor"
icons = ["../../assets/icons/emulsion.ico"]
binaries-dir = "../../target/release"
# Flatten Cargo's runtime DLLs beside the executable, resolving ort symlinks.
resources = [
    "../../target/release/*.dll",
    { src = "../../target/release/licenses", target = "licenses" },
]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "../../assets/icons/emulsion.ico"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
