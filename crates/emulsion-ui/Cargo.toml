[package]
name = "emulsion-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPUI views and design tokens for Emulsion"

[features]
canvas-bench = []
# Opt-in framework benchmark dependencies; absent from ordinary app/test builds.
layout-bench = ["dep:criterion", "dep:gpui-bench"]

[[bench]]
name = "layout_reuse"
harness = false
required-features = ["layout-bench"]

[[bench]]
name = "editor_navigation"
harness = false
required-features = ["layout-bench"]

[[bench]]
name = "scene_finish"
harness = false

[lints]
workspace = true

[dependencies]
criterion = { version = "0.5", optional = true }
gpui-bench = { package = "gpui-pre", version = "=0.3.5", features = ["bench-support"], optional = true }
unicode-segmentation = "1"
glam = { workspace = true }
emulsion-ai = { workspace = true }
emulsion-assistant = { workspace = true }
emulsion-mcp = { workspace = true }
emulsion-recipes = { workspace = true }
async-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
emulsion-io = { workspace = true }
emulsion-cloud = { workspace = true }
tempfile = "3.27"
emulsion-raster = { workspace = true }
emulsion-filters = { workspace = true }
emulsion-gpu = { workspace = true }
emulsion-engine = { workspace = true, features = ["gpui"] }
rayon = { workspace = true }
smallvec = { workspace = true }
image = { workspace = true }
toml = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
gpui-kit = { workspace = true }
# Same major as gpui-component, so one locale switches both.
rust-i18n = "4.2"
sys-locale = "0.3"
emulsion-core = { workspace = true }
emulsion-scene = { workspace = true }
# Native audio output for animatic playback (ALSA on Linux: libasound2-dev).
cpal = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
gpui-pre-wgpu = "=0.3.5"
wgpu = { workspace = true }
evdev = "0.13"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "block2"] }
block2 = "0.6.2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview"] }

[dev-dependencies]
tempfile = "3.27"
wgpu = { workspace = true }
gpui-kit = { workspace = true, features = ["test-support"] }
rawler = { workspace = true }
