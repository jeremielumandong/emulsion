[package]
name = "emulsion-engine"
description = "GPU canvas engine: tiled raster compositor on wgpu with a Vello vector layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
bytemuck = { workspace = true }
cosmic-text = { workspace = true }
pollster = { workspace = true }
tracing = { workspace = true }
wgpu = { workspace = true }
emulsion-core = { workspace = true }
emulsion-raster = { workspace = true }
rstar = "0.12"
vello = "0.10"

# The engine adopts GPUI's wgpu device rather than creating its own, so every
# texture it makes is usable by GPUI's renderer. See `Gpu::from_shared`.
[target.'cfg(target_os = "linux")'.dependencies]
gpui-pre-wgpu = "=0.3.5"

[lints]
workspace = true
