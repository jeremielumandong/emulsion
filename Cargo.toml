[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/gpui/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
# internal
emulsion-core = { path = "crates/emulsion-core" }
emulsion-raster = { path = "crates/emulsion-raster" }
emulsion-gpu = { path = "crates/emulsion-gpu" }
emulsion-tools = { path = "crates/emulsion-tools" }
emulsion-filters = { path = "crates/emulsion-filters" }
emulsion-color = { path = "crates/emulsion-color" }
emulsion-io = { path = "crates/emulsion-io" }
emulsion-recipes = { path = "crates/emulsion-recipes" }
emulsion-ai = { path = "crates/emulsion-ai" }
emulsion-mcp = { path = "crates/emulsion-mcp" }
emulsion-assistant = { path = "crates/emulsion-assistant" }
emulsion-ui = { path = "crates/emulsion-ui" }

# ui (pinned exactly; GPUI is pre-1.0)
gpui-kit = "=0.6.4"

# common
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1"
smallvec = "1"
glam = "0.33"

# assistant
async-channel = "2"
base64 = "0.23"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# pixels / io
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "webp", "tiff", "bmp", "gif",
    # GIMP-parity imports: Targa, PNM/PAM, Windows icons, Radiance HDR,
    # OpenEXR, DirectDraw surfaces, QOI and farbfeld.
    "tga", "pnm", "ico", "hdr", "exr", "dds", "qoi", "ff",
] }
# JPEG XL, pure Rust. GIMP's native XCF, 8-bit layers.
jxl-oxide = { version = "0.12", default-features = false, features = ["image", "rayon"] }
xcf-rs = "0.5"
wgpu = "29"            # same major as gpui-pre 0.3.5 so one wgpu is linked (spike 6)
bytemuck = "1.25"
pollster = "0.4"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
quick-xml = { version = "0.42", features = ["serialize"] }
cosmic-text = "0.19"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls", "api-27"] }
ndarray = "0.17"
sha2 = "0.11"
ag-psd = "0.3.0"
rawler = { version = "0.8", default-features = false }
moxcms = "0.9"
kamadak-exif = "0.6"
plist = "1.10"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 1            # GPUI and image decoding are unusable at opt-level 0

[profile.dev.package."*"]
opt-level = 3            # dependencies always optimized; our crates stay fast to rebuild

[profile.release]
lto = "thin"
codegen-units = 1

# Editable copies of the exact GPUI packages recorded in vendor/gpui/UPSTREAM.json.
[patch.crates-io]
gpui-base = { path = "vendor/gpui/gpui-base" }
gpui-component = { path = "vendor/gpui/gpui-component" }
gpui-component-macros = { path = "vendor/gpui/gpui-component-macros" }
gpui-kit = { path = "vendor/gpui/gpui-kit" }
gpui-kit-assets = { path = "vendor/gpui/gpui-kit-assets" }
gpui-pre = { path = "vendor/gpui/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui/gpui-pre-apple" }
gpui-pre-collections = { path = "vendor/gpui/gpui-pre-collections" }
gpui-pre-derive-refineable = { path = "vendor/gpui/gpui-pre-derive-refineable" }
gpui-pre-http-client = { path = "vendor/gpui/gpui-pre-http-client" }
gpui-pre-linux = { path = "vendor/gpui/gpui-pre-linux" }
gpui-pre-macos = { path = "vendor/gpui/gpui-pre-macos" }
gpui-pre-macros = { path = "vendor/gpui/gpui-pre-macros" }
gpui-pre-media = { path = "vendor/gpui/gpui-pre-media" }
gpui-pre-perf = { path = "vendor/gpui/gpui-pre-perf" }
gpui-pre-platform = { path = "vendor/gpui/gpui-pre-platform" }
gpui-pre-refineable = { path = "vendor/gpui/gpui-pre-refineable" }
gpui-pre-reqwest = { path = "vendor/gpui/gpui-pre-reqwest" }
gpui-pre-scheduler = { path = "vendor/gpui/gpui-pre-scheduler" }
gpui-pre-shared-string = { path = "vendor/gpui/gpui-pre-shared-string" }
gpui-pre-sum-tree = { path = "vendor/gpui/gpui-pre-sum-tree" }
gpui-pre-util = { path = "vendor/gpui/gpui-pre-util" }
gpui-pre-util-macros = { path = "vendor/gpui/gpui-pre-util-macros" }
gpui-pre-web = { path = "vendor/gpui/gpui-pre-web" }
gpui-pre-wgpu = { path = "vendor/gpui/gpui-pre-wgpu" }
gpui-pre-windows = { path = "vendor/gpui/gpui-pre-windows" }
gpui-pre-zlog = { path = "vendor/gpui/gpui-pre-zlog" }
gpui-pre-ztracing = { path = "vendor/gpui/gpui-pre-ztracing" }
gpui-pre-ztracing-macro = { path = "vendor/gpui/gpui-pre-ztracing-macro" }
